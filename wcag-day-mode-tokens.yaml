# =========================================================================
# WCAG Day Mode Theme Tokens — Zoho CRM Design System
# Converted from uploaded file: WCAG (☀️ Day Mode).tokens.json
# Format: DTCG (Design Token Community Group) structure, 1:1 preserved from source.
#
# WRITTEN FOR ANY LLM/TOOL READING THIS FILE — no external context assumed:
#
# - Each leaf token follows the DTCG shape:
#     $type: "color"
#     $value: { colorSpace, components, alpha, hex }
#     $extensions: { com.figma.variableId, com.figma.scopes, [com.figma.aliasData] }
#   The authoritative value to use in code is $value.hex (or $value.components
#   for the raw sRGB 0-1 float triplet). $extensions is Figma metadata only —
#   not needed for codegen, but useful for tracing a token back to its Figma variable.
#
# - Some tokens carry $extensions.com.figma.aliasData instead of / alongside a
#   direct value. This means the token is an ALIAS pointing to another variable
#   (targetVariableName / targetVariableSetName) rather than an independent value —
#   resolve the alias chain if you need the final concrete color.
#
# - Top-level groups map to design areas, not strictly to component names:
#     Common Bg, Primary Palette, Bg Colors, Border Colors, Pastel Colors,
#     Color Tags, Status Colors, Icons  -> core/system-wide tokens
#     Component                          -> per-component tokens (Buttons, Checkbox,
#                                            Dropdown, Input, Modal, Table, Tab, etc.)
#     New Module Builder, Builder Colors, Kanban, Setup Left panel,
#     Search Highlight, Keyboard Focus, Zia -> feature-specific tokens, NOT core system tokens
#     Boolean, Measurement Colors        -> misc/utility groups
#
# - KNOWN DUPLICATION: the "String Values" group repeats several of the above
#   groups (Common BG, Primary Palette, Bg Colors, Border Colors, Multiselect-Tag,
#   Pastel Colors, Color Tags, Status Colors, Kanban, Drag & Drop, Setup Left panel)
#   as $type: "string" versions of the same tokens (hex strings instead of the
#   structured color object). This mirrors a known duplication issue already
#   identified in this design system's broader token audit — treat "String Values"
#   as redundant/legacy, NOT as a separate set of colors to use.
#
# - This file represents ONE mode (WCAG / Day) of a six-mode token system
#   (NXT Gen Day/Night, WCAG Day/Night, Themes, IDC/legacy). Do not assume these
#   values apply to any other mode.
#
# - NOTE: an earlier version of this same-named file was previously pulled from a
#   public GitHub repo during this project; the values in THIS file (directly
#   uploaded) differ from that earlier one and should be treated as the current
#   source of truth going forward.
# =========================================================================

